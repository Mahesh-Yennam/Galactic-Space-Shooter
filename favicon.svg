<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#030712"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4"/>
  <!-- Twin Laser Beams -->
  <line x1="20" y1="8" x2="20" y2="24" stroke="#38bdf8" stroke-width="2.5" filter="url(#laserGlow)"/>
  <line x1="44" y1="8" x2="44" y2="24" stroke="#38bdf8" stroke-width="2.5" filter="url(#laserGlow)"/>
  <!-- Starfighter Hull -->
  <polygon points="32,12 48,46 39,40 32,52 25,40 16,46" fill="url(#spaceGrad)" stroke="#60a5fa" stroke-width="2"/>
  <!-- Cockpit Core -->
  <ellipse cx="32" cy="30" rx="3.5" ry="6.5" fill="#67e8f9" filter="url(#laserGlow)"/>
  <!-- Engine Thruster Flare -->
  <polygon points="30,52 34,52 32,58" fill="#f59e0b" filter="url(#laserGlow)"/>
</svg>
